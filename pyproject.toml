[project]
name = "ugs-matchsim"
version = "0.2.0"
description = "Unofficial local simulator of rule-based matchmaking (UGS Matchmaker rules shape)"
readme = "README.md"
requires-python = ">=3.11"
# runtime = stdlib only
dependencies = []

[project.scripts]
ugs-matchsim = "ugs_matchsim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ugs_matchsim"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
